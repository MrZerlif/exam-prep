name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        pdf: ["none", "pypdfium2"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install optional PDF backend
        if: matrix.pdf == 'pypdfium2'
        run: python -m pip install pypdfium2
      - name: Run unit tests
        run: python -m unittest discover -s tests -t .
