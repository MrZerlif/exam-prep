name: release

on:
  push:
    tags: ["v*.*.*"]

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build self-contained skill archive
        run: |
          mkdir -p dist/exam-prep
          cp -R skill/exam-prep/SKILL.md skill/exam-prep/scripts skill/exam-prep/references \
            skill/exam-prep/schemas skill/exam-prep/templates skill/exam-prep/config \
            skill/exam-prep/examples dist/exam-prep/
          (cd dist && zip -r exam-prep.zip exam-prep)
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Exam Prep is an evidence-driven Agent Skill with a deterministic Python engine for exam preparation.

            See the [README](https://github.com/MrZerlif/exam-prep/blob/${{ github.ref_name }}/README.md) for installation, workflows, and limitations.
          files: |
            dist/exam-prep.zip
          fail_on_unmatched_files: true
